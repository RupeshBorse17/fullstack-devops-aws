name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 353400075967.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          docker build -t $ECR_REGISTRY/devops-backend:latest ./backend
          docker push $ECR_REGISTRY/devops-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t $ECR_REGISTRY/devops-frontend:latest ./frontend
          docker push $ECR_REGISTRY/devops-frontend:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 353400075967.dkr.ecr.ap-south-1.amazonaws.com
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
